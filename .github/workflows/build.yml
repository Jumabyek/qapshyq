# Builds the Windows installer and the macOS .dmg on GitHub's computers.
#  - Run it by hand: GitHub -> Actions -> "Build installers" -> Run workflow
#    (the files appear under the run as "artifacts")
#  - Or publish a release: GitHub -> Releases -> Draft a new release -> tag v1.0.1 -> Publish.
#    Both installers are then built and attached to that release automatically.
name: Build installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the files to this existing release tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build app and installer
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          scripts\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Qapshyq-Windows
          path: dist/Qapshyq-Setup-*.exe
      - name: Build MSIX for the Microsoft Store
        shell: pwsh
        run: ./scripts/build_msix.ps1
      - name: Check that the MSIX installs and starts
        shell: pwsh
        continue-on-error: true
        run: |
          # Developer mode lets Windows install an unsigned package (test only).
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          Add-AppxPackage -Register build\msix\AppxManifest.xml
          $pkg = Get-AppxPackage *Qapshyq*
          $pkg | Format-List Name, Version, PackageFamilyName, Status
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!Qapshyq"
          Start-Sleep -Seconds 10
          $proc = Get-Process Qapshyq -ErrorAction SilentlyContinue
          if ($proc) { Write-Host "Qapshyq is running from the MSIX package (pid $($proc.Id))"; $proc | Stop-Process -Force }
          else { Write-Error "Qapshyq did not start from the MSIX package" }
      - uses: actions/upload-artifact@v4
        with:
          name: Qapshyq-Windows-Store-MSIX
          path: dist/Qapshyq-*.msix
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/Qapshyq-Setup-*.exe

  macos:
    runs-on: macos-15          # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build app and dmg
        run: bash scripts/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Qapshyq-macOS
          path: dist/Qapshyq-*-mac.dmg
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/Qapshyq-*-mac.dmg
