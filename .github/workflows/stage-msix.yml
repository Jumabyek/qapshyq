# Puts an already-built Store MSIX on a temporary "store-upload" branch, so it can be
# loaded straight into Partner Center from raw.githubusercontent.com.
# Run: Actions -> "Stage MSIX for Store upload" -> Run workflow -> paste the build run id.
# Delete the branch after uploading.
name: Stage MSIX for Store upload

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the 'Build installers' run that produced the Qapshyq-Windows-Store-MSIX artifact"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Qapshyq-Windows-Store-MSIX
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - name: Push the MSIX to the store-upload branch
        run: |
          cd out
          ls -la
          git init -q -b store-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Store MSIX for Partner Center upload (temporary)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-upload
